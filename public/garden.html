<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Type Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&family=Inter:wght@700&family=DM+Sans:opsz,wght@9..40,700&family=Plus+Jakarta+Sans:wght@700&family=Work+Sans:wght@700&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Fraunces:opsz,wght@9..144,800&family=Archivo+Black&family=Instrument+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter+Tight:wght@800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#EDEDED;font-family:'DM Mono',ui-monospace,monospace}
a{color:#fff} a:hover{color:#FFB4A8}
input[type=range]{accent-color:#FFFFFF}
[data-tg="app"]{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0;cursor:text}
[data-tg="app"] button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html[data-touch] [data-tg="app"]{touch-action:none;top:var(--tg-top,0px)!important;bottom:auto!important;height:var(--tg-h,100%)!important}
[data-tg="modes"]{position:absolute;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:5;display:flex;gap:4px;padding:4px;border:1px solid #2A2A2A;border-radius:999px;background:#000}
[data-tg="bar"]{position:absolute;left:calc(24px + env(safe-area-inset-left));right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:0.04em;opacity:0.6}
[data-tg="coarse"]{display:none}
@media (pointer:coarse){[data-tg="fine"]{display:none}[data-tg="coarse"]{display:inline}}
@media (max-width:600px){
  [data-tg="bar"]{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));gap:10px!important}
  [data-tg="hints"]{gap:12px!important;font-size:11px}
  [data-tg="ctrls"]{flex:1 1 100%;justify-content:space-between;gap:8px!important}
  [data-tg="pal"]{gap:4px!important}
  [data-tg="sw"]{--sw:clamp(13px,calc((100vw - 183px) / 10),22px);width:var(--sw)!important;height:var(--sw)!important}
  [data-tg="dot"]{width:calc(var(--sw) * .46)!important;height:calc(var(--sw) * .46)!important}
  [data-tg="btn"]{padding:7px 11px!important}
}
[data-tg="poster"]{position:absolute;inset:0;display:none;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#000;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:0.03em}
[data-tg="poster"].open{display:grid}
@media (max-width:720px){
  [data-tg="poster"]{display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  [data-tg="poster"].open{display:flex}
  [data-tg="poster"]::before{content:"";order:-2;position:sticky;top:0;flex:none;height:calc(60px + env(safe-area-inset-top));margin-bottom:calc(-60px - env(safe-area-inset-top));background:linear-gradient(#000 62%,rgba(0,0,0,0));z-index:4;pointer-events:none}
  [data-tg="stage"]{order:-1;flex:none;padding:calc(64px + env(safe-area-inset-top)) 16px 12px!important}
  [data-tg="pcanvas"]{width:100%!important;max-width:520px}
  [data-tg="panel"]{flex:none;border-right:0!important;border-top:1px solid #1E1E1E;overflow:visible!important;padding:20px 16px calc(32px + env(safe-area-inset-bottom))!important}
}
[data-tg="panel"]{border-right:1px solid #1E1E1E;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#0A0A0A}
[data-tg="stage"]{display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0}
[data-tg="pcanvas"]{width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1 / 1;display:block;border:1px solid #1E1E1E}

/* ---- Swiss poster panel (palette-synced) ---- */
[data-tg="poster"]{--pbg:#000;--pfg:#fff;--pacc:#FF1400;--pline:color-mix(in srgb,var(--pfg) 16%,transparent);--psoft:color-mix(in srgb,var(--pfg) 6%,transparent);background:var(--pbg)!important;grid-template-columns:minmax(300px,360px) minmax(0,1fr)!important;transition:background .3s}
[data-tg="panel"]{background:var(--pbg)!important;color:var(--pfg);border-right:1px solid var(--pline)!important;padding:16px!important;gap:12px!important;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;transition:background .3s,color .3s}
[data-tg="pcanvas"]{border-radius:20px;border:1px solid var(--pline)!important}
.sx-head{padding:18px 18px 16px;border-radius:20px;background:var(--psoft);display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;position:relative}
.sx-head::after{content:"";position:absolute;right:18px;top:18px;width:12px;height:12px;background:var(--pacc);border-radius:50%}
.sx-title{font-weight:700;font-size:44px;line-height:.9;letter-spacing:-0.04em;margin:0}
.sx-meta{font-size:11px;opacity:.6;text-align:right;line-height:1.5}
.sx-sec{padding:16px;border-radius:20px;border:1px solid var(--pline);display:flex;flex-direction:column;gap:12px}
.sx-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:500;letter-spacing:.02em;opacity:.75}
.sx-lbl b{font-weight:700;color:var(--pacc)}
.sx-input{background:var(--psoft);border:1px solid var(--pline);border-radius:14px;color:var(--pfg);font-weight:700;font-size:22px;padding:10px 14px;outline:none;width:100%;box-sizing:border-box}
.sx-input:focus{border-color:var(--pacc)}
.sx-link{align-self:flex-start;background:var(--psoft);border:1px solid var(--pline);border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;color:var(--pfg);cursor:pointer}
.sx-link:hover{border-color:var(--pacc)}
.sx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sx-cell{background:transparent;border:1px solid var(--pline);border-radius:14px;color:var(--pfg);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .15s,border-color .15s}
.sx-cell:hover{background:var(--psoft)}
.sx-cell.on{background:var(--pfg);color:var(--pbg);border-color:var(--pfg)}
.sx-cell .n{font-size:10px;opacity:.5}
.sx-cell .t{font-size:13px;font-weight:700}
.sx-cell .s{font-size:11px;opacity:.6}
.sx-cell .spec{font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden}
.sx-sw{display:flex;height:32px;border-radius:9px;overflow:hidden}
.sx-sw span{flex:1}
.sx-sw i{font-style:normal;font-weight:700;font-size:15px;display:flex;align-items:center;padding:0 8px}
.sx-exp{padding:16px;border-radius:20px;background:var(--psoft);display:flex;flex-direction:column;gap:8px}
.sx-btn{background:var(--pfg);color:var(--pbg);border:0;border-radius:999px;font:inherit;font-weight:700;font-size:14px;padding:13px 16px;cursor:pointer}
.sx-btn:hover:not(:disabled){background:var(--pacc)}
.sx-btn.ghost{background:transparent;color:var(--pfg);box-shadow:inset 0 0 0 1px var(--pline)}
.sx-btn.ghost:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--pfg);background:transparent}
.sx-btn:disabled{opacity:.4;cursor:default}
.sx-status{font-size:11px;color:var(--pacc);min-height:14px}
@media (max-width:720px){[data-tg="panel"]{border-top:1px solid var(--pline)!important}.sx-title{font-size:36px}}
</style>
</head>
<body>
<div data-tg="app" id="app">
  <canvas id="cv" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <input id="inp" data-tg="input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" style="position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none">

  <div data-tg="modes" id="modes"></div>

  <div data-tg="bar" id="bar">
    <div data-tg="hints" id="hints" style="display:flex;gap:20px;flex-wrap:wrap">
      <span data-tg="fine">type to grow</span><span data-tg="coarse">tap to type</span>
      <span>space cuts</span>
      <span data-tg="fine">backspace withers</span><span data-tg="coarse">⌫ withers</span>
      <span data-tg="fine">enter clears</span><span data-tg="coarse">return clears</span>
    </div>
    <div data-tg="ctrls" style="display:flex;gap:8px;align-items:center">
      <div data-tg="pal" id="tpal" style="display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3A3A3A;border-radius:999px;background:#000"></div>
      <button data-tg="btn" id="pngBtn" style="background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer">PNG</button>
      <button data-tg="btn" id="svgBtn" style="background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer">SVG</button>
    </div>
  </div>

  <div data-tg="poster" id="poster">
    <div data-tg="panel">
      <div class="sx-head">
        <h2 class="sx-title">Poster</h2>
        <div class="sx-meta">Type Garden<br><span id="infoLabel">1:1 · 3s loop · 30 fps</span></div>
      </div>
      <div class="sx-sec">
        <div class="sx-lbl"><span>01 — Words</span><b>A</b></div>
        <input id="pText" class="sx-input" spellcheck="false">
        <div class="sx-lbl"><span>Size</span><b id="pSizeV">100%</b></div>
        <input id="pSize" type="range" min="50" max="180" step="5" value="100" style="width:100%;accent-color:var(--pacc)">
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer"><input id="pOne" type="checkbox" style="accent-color:var(--pacc);width:16px;height:16px"> Fit text in one line</label>
        <button id="reshuffle" class="sx-link">↻ Regrow garden</button>
      </div>
      <div class="sx-sec">
        <div class="sx-lbl"><span>02 — Typeface</span><b>Aa</b></div>
        <div id="fonts" class="sx-grid"></div>
      </div>
      <div class="sx-sec">
        <div class="sx-lbl"><span>03 — Motion</span><b>→</b></div>
        <div id="presets" class="sx-grid"></div>
      </div>
      <div class="sx-sec">
        <div class="sx-lbl"><span>04 — Palette</span><b>●</b></div>
        <div id="ppal" class="sx-grid"></div>
      </div>
      <div class="sx-exp">
        <div class="sx-lbl"><span>05 — Export</span><span>1080 × 1080</span></div>
        <button id="exportVideo" class="sx-btn">Export MP4 loop</button>
        <button id="exportFrames" class="sx-btn ghost">PNG frames (.zip)</button>
        <div class="sx-status" id="status"></div>
      </div>
    </div>

    <div data-tg="stage">
      <canvas id="pcv" data-tg="pcanvas" width="1080" height="1080"></canvas>
    </div>
  </div>
</div>

<script>
class TypeGarden {
  constructor() {
    this.app = document.getElementById('app');
    this.cv = document.getElementById('cv');
    this.inp = document.getElementById('inp');
    this.pcv = document.getElementById('pcv');
    this.g = this.cv.getContext('2d');
    this.bar = document.getElementById('bar');
    this.poster = document.getElementById('poster');
    this.modes = document.getElementById('modes');
    this.tpal = document.getElementById('tpal');
    this.ppal = document.getElementById('ppal');
    this.presetsEl = document.getElementById('presets');
    this.pText = document.getElementById('pText');
    this.infoLabel = document.getElementById('infoLabel');
    this.status = document.getElementById('status');

    this.SENT = '\u200b';
    this.FONTS = [
      ['Helvetica','"Helvetica Neue",Helvetica,Arial,sans-serif','700'],
      ['Inter','"Inter",Helvetica,sans-serif','700'],
      ['DM Sans','"DM Sans",sans-serif','700'],
      ['Jakarta','"Plus Jakarta Sans",sans-serif','700'],
      ['Work Sans','"Work Sans",sans-serif','700'],
      ['Playfair','"Playfair Display",Georgia,serif','700'],
      ['Space Grotesk','"Space Grotesk",sans-serif','700'],
      ['Syne','"Syne",sans-serif','800'],
      ['Fraunces','"Fraunces",Georgia,serif','800'],
      ['Archivo Black','"Archivo Black",sans-serif','400'],
      ['Instrument','"Instrument Serif",Georgia,serif','400'],
      ['Bricolage','"Bricolage Grotesque",sans-serif','800'],
      ['Inter Tight','"Inter Tight",Helvetica,sans-serif','800']
    ];
    this.F = this.FONTS[0][1]; this.FW = this.FONTS[0][2];
    this.FLOWERS = ['iris','fern','poppy','tulip','violet','clover','daisy','lilac','aster','peony','sorrel','yarrow','thistle','bluebell','foxglove','primrose'];
    this.TINTS = ['#FF8A00','#E63CFF','#7FD18B','#9FB4FF','#FFB7C5','#FFE2B8','#2FB8A6','#FFD23F'];
    this.PAL = [
      ['Rose noir','#000000','#FF1400','#3257FF','#FFB4A8','#FFFFFF'],
      ['Paper','#F3EEE4','#FF3B1F','#1C2B8F','#FFD2C4','#111111'],
      ['Midnight','#0D1B4C','#FF5A4E','#9FB4FF','#FFD6CF','#FFFFFF'],
      ['Citrus','#0E1A12','#FF8A00','#1FA463','#FFE2B8','#FFF6E8'],
      ['Orchid','#140A1F','#E63CFF','#2FB8A6','#F9D1FF','#FFFFFF'],
      ['Moss','#133A2A','#FFB7C5','#7FD18B','#FFFFFF','#F6F1E7'],
      ['Tomato','#FF1400','#FFF1E0','#0B0B0B','#FF1400','#000000'],
      ['Butter','#FFE9A8','#E4002B','#0F5132','#FFC2C2','#1A1A1A'],
      ['Blush','#FAD4D8','#C8102E','#274690','#FFE3E6','#1A1A1A'],
      ['Lemon','#FFF6CC','#F2542D','#3D5A80','#FFD9C9','#2B2A26'],
      ['Mono','#000000','#F2F2F2','#6E6E6E','#000000','#FFFFFF']
    ];
    this.PRESETS = [
      { id:'breathe', label:'Breathe', sub:'Slow sway · 3s', T:3000 },
      { id:'grow', label:'Grow & wither', sub:'Bloom, then back · 6s', T:6000 },
      { id:'typed', label:'Typed', sub:'Type, cut, repeat · 5s', T:5000 },
      { id:'wind', label:'Gust', sub:'Wind sweeps through · 4s', T:4000 },
      { id:'reach', label:'Reach', sub:'Stems follow a light · 6s', T:6000 },
      { id:'scatter', label:'Scatter', sub:'Random bloom, fade · 6s', T:6000 },
      { id:'visit', label:'Visitor', sub:'Butterfly drops by · 7s', T:7000 }
    ];
    this.props = { boil:true, recoil:20, density:1, showHint:true };
    this.state = { font:0, mode:'type', preset:'breathe', palette:0, text:'in bloom', seed:7, size:100, oneLine:false, status:'', busy:false };

    this.letters = [];
    this.uid = 1;
    this.cache = {};
    this.Sd = 0; this.St = 0; this.wrapped = false;
    this.t0 = performance.now();
    this.lastKey = 0;
    this.rand = Math.random;
    this.flies = [];
    this.perch = [];
    this.fa = {};
    this.mx = null; this.my = null;
    this.gifts = [];
    this._gl = null;

    this.vmime = typeof MediaRecorder !== 'undefined'
      ? ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(m => MediaRecorder.isTypeSupported(m))
      : null;

    this.touch = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
    if (this.touch) document.documentElement.setAttribute('data-touch','');
    this.ptype = 'mouse';

    this.initUI();
    this.bindEvents();
    this.resize();
    const loop = () => { this.raf = requestAnimationFrame(loop); this.frame(); };
    loop();
    this.inp.value = this.SENT;
    this.iv = this.SENT;
    if (!this.touch) setTimeout(() => this.inp.focus({ preventScroll:true }), 50);
    if (document.fonts) document.fonts.load(`${this.FW} 100px ${this.F}`).then(() => { this.cache = {}; this.layout(true); this.buildPoster(); }).catch(() => {});
    this.buildPoster();
  }

  // ---------- UI ----------
  initUI() {
    const mkBtn = (label, onClick, styles='') => { const b=document.createElement('button'); b.textContent=label; b.style.cssText='border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;letter-spacing:0.04em;cursor:pointer;'+styles; b.addEventListener('click',onClick); return b; };
    this.typeModeBtn = mkBtn('Type', () => this.setMode('type'));
    this.posterModeBtn = mkBtn('Poster', () => this.setMode('poster'));
    this.modes.appendChild(this.typeModeBtn); this.modes.appendChild(this.posterModeBtn);

    document.getElementById('pngBtn').addEventListener('click', () => { this.savePNG(); this.refocus(); });
    document.getElementById('svgBtn').addEventListener('click', () => { this.saveSVG(); this.refocus(); });

    this.PAL.forEach((p,i) => {
      const sw = document.createElement('button');
      sw.dataset.tg='sw'; sw.setAttribute('aria-label',p[0]); sw.title=p[0];
      sw.style.cssText='width:22px;height:22px;padding:0;border-radius:999px;cursor:pointer;background:'+p[1]+';border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;transition:transform .15s';
      sw.innerHTML='<span data-tg="dot" style="width:10px;height:10px;border-radius:999px;background:'+p[2]+'"></span>';
      sw.addEventListener('click', e => { e.stopPropagation(); this.setPalette(i); });
      this.tpal.appendChild(sw);

      const card = document.createElement('button');
      card.className='sx-cell';
      card.innerHTML = '<span class="sx-sw" style="background:'+p[1]+'"><i style="color:'+p[5]+'">Aa</i><span style="background:'+p[2]+'"></span><span style="background:'+p[3]+'"></span><span style="background:'+p[4]+'"></span></span><span class="t">'+p[0]+'</span>';
      card.addEventListener('click', () => this.setPalette(i));
      this.ppal.appendChild(card);
    });

    this.PRESETS.forEach(p => {
      const b = document.createElement('button');
      b.className='sx-cell';
      b.innerHTML = '<span class="n">'+String(this.presetsEl.childNodes.length+1).padStart(2,'0')+'</span><span class="t">'+p.label+'</span><span class="s">'+p.sub+'</span>';
      b.addEventListener('click', () => { this.state.preset = p.id; this.buildPoster(); this.updateUI(); });
      this.presetsEl.appendChild(b);
    });

    this.fontsEl = document.getElementById('fonts');
    this.FONTS.forEach((f,i) => {
      const b = document.createElement('button'); b.className='sx-cell';
      b.innerHTML = '<span class="spec" style="font-family:'+f[1].replace(/"/g,"'")+';font-weight:'+f[2]+'">Ag</span><span class="s">'+f[0]+'</span>';
      b.addEventListener('click', () => this.setFont(i));
      this.fontsEl.appendChild(b);
    });
    this.pText.addEventListener('input', e => { this.state.text = e.target.value; this.buildPoster(); });
    document.getElementById('pSize').addEventListener('input', e => { this.state.size = +e.target.value; document.getElementById('pSizeV').textContent = e.target.value + '%'; this.buildPoster(); });
    document.getElementById('pOne').addEventListener('change', e => { this.state.oneLine = e.target.checked; this.buildPoster(); });
    document.getElementById('reshuffle').addEventListener('click', () => { this.state.seed = Math.floor(Math.random()*1e6); this.buildPoster(); });
    document.getElementById('exportVideo').addEventListener('click', () => this.exportVideo());
    document.getElementById('exportFrames').addEventListener('click', () => this.exportFrames());
    this.updateUI();
  }

  setMode(m) {
    if (m === this.state.mode) return;
    this.state.mode = m;
    if (m === 'poster') { this.state.text = this.liveText() || this.state.text; this.pText.value = this.state.text; this.buildPoster(); }
    else { this.resize(); this.inp.focus({ preventScroll:true }); }
    this.updateUI();
  }
  setFont(i) {
    const f = this.FONTS[i]; this.state.font = i; this.F = f[1]; this.FW = f[2];
    this.pText.style.fontFamily = f[1]; this.pText.style.fontWeight = f[2];
    const go = () => { this.cache = {}; this.layout(true); this.buildPoster(); this.updateUI(); };
    go(); if (document.fonts) document.fonts.load(`${f[2]} 100px ${f[1]}`).then(go).catch(() => {});
  }
  setPalette(i) {
    this.state.palette = i; this.cache={}; this.layout(true); this.buildPoster(); this.updateUI(); this.refocus();
  }
  updateUI() {
    const s = this.state, pc = this.pal();
    this.app.style.background = pc.bg;
    this.bar.style.color = pc.C.text;
    this.tpal.style.background = pc.bg;
    this.bar.style.display = s.mode === 'type' && (this.props.showHint??true) ? 'flex' : 'none';
    { const P=this.PAL[s.palette]; const ps=this.poster.style; ps.setProperty('--pbg',P[1]); ps.setProperty('--pfg',P[5]); ps.setProperty('--pacc',P[2]); }
    this.poster.classList.toggle('open', s.mode === 'poster');
    this.cv.style.display = s.mode === 'type' ? 'block' : 'none';

    const setBtn = (b, active, fgInactive) => { b.style.background = active ? '#FFFFFF' : 'transparent'; b.style.color = active ? '#000000' : (fgInactive||'#BDBDBD'); };
    setBtn(this.typeModeBtn, s.mode === 'type');
    setBtn(this.posterModeBtn, s.mode === 'poster');

    this.tpal.childNodes.forEach((sw,i) => {
      const active = i === s.palette;
      sw.style.borderColor = active ? pc.C.text : (this.PAL[i][1] === pc.bg ? '#3A3A3A' : 'transparent');
      sw.style.transform = active ? 'scale(1.1)' : 'scale(1)';
    });
    this.ppal.childNodes.forEach((card,i) => {
      card.classList.toggle('on', i === s.palette);

  render(B,now,st){

    this.cc=st.C; this._now=now; if(st.face)this.perch=[];
    if(st.face)for(const l of L){
      let tx=0,ty=0;
      const A=!l.dead && l.ch!==' '?this.near(l.x,l.y-S*0.6):null;
      if(A){ const dx=A[0]-l.x, dy=A[1]-(l.y-S*0.6), d=Math.hypot(dx,dy), reach=Math.max(260,S*3.2); if(d<reach && d>1){ const w=1-d/reach, s=w*w*(3-2*w); tx=dx/d*s; ty=dy/d*s; } }
      const c=l.lean||(l.lean=[0,0]);
      c[0]+=(tx-c[0])*0.07; c[1]+=(ty-c[1])*0.07;
    }
    const f=st.boil?Math.floor(now/120):0, amp=st.boil?Math.max(0.8,S*0.01):0;
    const kd=l=>l.dead?1-this.eo((now-l.dead)/st.wither):1;
    const draw=layer=>{
      for(const l of L){
        if(l.ch===' ' || !l.els)continue;
        const age=(now-l.birth)*sp, kk=kd(l);
        const each=e=>{ if(e.t==='stem')this.drawStem(B,e,l,age,kk,st,f,amp,layer); else if(e.layer===layer)this.drawEl(B,e,l,age,kk,st,f,amp); };
        l.els.forEach(each);
        if(l.endEls)l.endEls.forEach(each);
        const i=act.indexOf(l), nx=i>=0?act[i+1]:null;
        if(l.tend && (l.dead || !nx || nx.ch===' ')){
          let fr=this.eo(((now-l.tb)*sp-150)/450);
          if(l.cut!=null) fr*=1-this.eo((now-l.cut)*sp/150)*Math.min(0.85,st.recoil/(0.6*S));
          for(const e of l.tend) this.drawStem(B,e,l,age,kk,st,f,amp,layer,fr*kk);
        }
      }
    };
    draw(0);
    for(const l of L) if(l.ch!==' ' && (st.textAll || !l.dead)) B.text(l.ch,l.x,l.y,S,st.C.text);
    draw(1);
  }
  wpt(st,l,x,y){
    if(l.birth!=null && this._now!=null){
      const t=(this._now-l.birth)*(st.speed||1)/1000;
      if(t>0 && t<2.5){
        const hh=Math.max(0,(l.y-y)/st.S), dmp=Math.exp(-t*3.2), dir=(l.id%2?1:-1);
        x+=st.S*0.07*hh*dmp*Math.sin(t*11)*dir;
        y+=st.S*0.035*hh*dmp*Math.sin(t*11+1.2);
      }
    }
    if(st.face && l.lean){
      const hh=Math.min(2.5,Math.max(0,(l.y-y)/st.S)), f=hh*hh*0.5+hh*0.5;
      x+=l.lean[0]*st.S*0.1*f;
      y+=l.lean[1]*st.S*0.05*f;
    }
    return st.warp?st.warp(x,y,l):[x,y];
  }
  drawStem(B,e,l,age,kk,st,f,amp,layer,frO){
    const S=st.S, fr=frO!=null?frO:this.eo((age-e.d0)/e.dur)*kk; if(fr<=0)return;
    const j=this.jit(e.id,f,amp);
    const P=e.pts.map(p=>this.wpt(st,l,l.x+p[0]*S+j[0],l.y+p[1]*S+j[1]));
    for(const sg of e.segs){
      if(sg.layer!==layer)continue;
      const b=Math.min(sg.u1,fr); if(b<=sg.u0)continue;
      this.strokeRange(B,P,sg.u0,b,st.C.blue,S*0.022*(e.w||1));
    }
    for(const th of e.thorns) if(fr>th.u && this.layerAt(e.segs,th.u)===layer) this.thorn(B,P,th.u,th.s,S);
  }
  drawEl(B,e,l,age,kk,st,f,amp){
    const S=st.S, j=this.jit(e.id,f,amp);
    const rw=st.rotw?st.rotw(e):0;
    if(e.t==='leaf'){
      const sc=this.spr((age-e.d0)/1000,7,15)*kk; if(sc<=0)return;
      const p=this.wpt(st,l,l.x+e.x*S+j[0],l.y+e.y*S+j[1]);
      this.leaf(B,p[0],p[1],e.a+j[2]+rw,e.L*S*sc,e.bend);
    } else if(e.t==='rose' || e.t==='bloom' || e.t==='tulip' || e.t==='clover'){
      const a=age-e.d0; if(a<0)return;
      if(kk<=0.001)return;
      const p=this.wpt(st,l,l.x+e.x*S+j[0],l.y+e.y*S+j[1]);
      const tl=st.face?this.faceTurn(e,p[0],p[1]):null;
      if((st.face||st.perchOn) && !l.dead && a>700) this.perch.push({id:e.id,x:p[0],y:p[1],R:e.R*S*kk});
      if (e.t === 'rose') this.rose(B,p[0],p[1],e.R*S*kk,e.rot+j[2]+rw+(tl?tl[0]*0.22:0),e,a,tl);
      else if (e.t === 'bloom') this.bloom(B,p[0],p[1],e.R*S*kk,e.rot+j[2]+rw+(tl?tl[0]*0.22:0),e,a,tl);
      else if (e.t === 'tulip') this.tulip(B,p[0],p[1],e.R*S*kk,e.rot+j[2]+rw+(tl?tl[0]*0.22:0),e,a,tl);
      else this.clover(B,p[0],p[1],e.R*S*kk,e.rot+j[2]+rw+(tl?tl[0]*0.22:0),e,a,tl);
    }
  }

  // ---------- butterflies ----------
  spawnFly(cx,cy){
    if(this.flies.length>=6){ const o=this.flies.find(f=>f.st!=='leave'); if(o)this.flyOff(o); }
    const taken=new Set(this.flies.filter(f=>f.st!=='leave').map(f=>f.pid));
    let best=null,bd=1e9;
    for(const p of this.perch){ if(taken.has(p.id))continue; const d=Math.hypot(p.x-cx,p.y-cy); if(d<bd){bd=d;best=p;} }
    const left=cx<this.W/2, sz=Math.max(9,this.Sd*0.09);
    this.flies.push({x:left?-40:this.W+40,y:cy+(Math.random()-0.5)*this.H*0.4,vx:0,vy:0,st:best?'fly':'wander',pid:best?best.id:null,hx:cx,hy:cy,t0:performance.now(),ph:Math.random()*6,sz,seed:Math.random()*100,ang:0});
  }
  flyOff(f){ f.st='leave'; f.pid=null; f.ex=f.x<this.W/2?-80:this.W+80; f.ey=f.y-this.H*0.3; }
  drawFlies(B,now,C){
    const dt=Math.min(48,now-(this._fl||now)); this._fl=now;
    const byId={}; for(const p of this.perch)byId[p.id]=p;
    this.flies=this.flies.filter(f=>{
      const t=(now-f.t0)/1000; let tx,ty;
      if(f.st==='sit' || f.st==='fly'){ const p=byId[f.pid]; if(!p)this.flyOff(f); else { tx=p.x+p.R*0.05; ty=p.y-p.R*0.55; } }
      if(f.st==='wander'){ tx=f.hx+Math.sin(t*1.3+f.seed)*70; ty=f.hy+Math.sin(t*2.1+f.seed)*40; if(t>3.5)this.flyOff(f); }
      if(f.st==='leave'){ tx=f.ex; ty=f.ey; }
      if(f.st==='sit'){
        f.x+=(tx-f.x)*0.35; f.y+=(ty-f.y)*0.35; f.ang*=0.85;
        f.ph+=dt*0.004;
        const burst=Math.sin(now/1000*0.9+f.seed)>0.75;
        f.open=burst?0.2+0.8*Math.abs(Math.cos(now/1000*9+f.seed)):0.25+0.15*Math.sin(f.ph);
      } else {
        const dx=tx-f.x, dy=ty-f.y, d=Math.hypot(dx,dy)||1, sp=f.st==='leave'?0.42:Math.min(0.34,0.06+d*0.0016);
        const flut=Math.sin(t*7+f.seed)*0.12, wob=Math.cos(t*4.3+f.seed)*0.1;
        const ax=(dx/d*sp+wob)-f.vx, ay=(dy/d*sp+flut)-f.vy;
        f.vx+=ax*0.06*dt/16; f.vy+=ay*0.06*dt/16;
        f.x+=f.vx*dt; f.y+=f.vy*dt+Math.sin(t*13+f.seed)*0.6;
        f.ang+=(Math.max(-0.5,Math.min(0.5,f.vx*1.4))-f.ang)*0.1;
        f.open=Math.abs(Math.cos(t*17+f.seed));
        if(f.st==='fly' && d<5){ f.st='sit'; f.ph=0; }
        if(f.st==='leave' && (f.x<-60 || f.x>this.W+60 || f.y<-60))return false;
      }
      this.butterfly(B,f.x,f.y,f.sz,f.ang,f.open,C);
      return true;
    });
  }
  butterfly(B,x,y,s,ang,o,C){
    const ca=Math.cos(ang), sa=Math.sin(ang), T=(px,py)=>[x+(px*ca-py*sa)*s, y+(px*sa+py*ca)*s];
    const wing=(cx,cy,rx,ry,a,side)=>{
      const pts=[], c=Math.cos(a), sn=Math.sin(a);
      for(let k=0;k<22;k++){ const th=k/22*Math.PI*2, r=1+0.08*Math.sin(th*3), lx=Math.cos(th)*rx*r, ly=Math.sin(th)*ry*r; pts.push(T(side*(cx+lx*c-ly*sn)*(0.12+0.88*o),cy+lx*sn+ly*c)); }
      return pts;
    };
    for(const sd of [-1,1]){
      B.fill(wing(0.46,0.28,0.36,0.3,0.5*sd*sd,sd),C.text);
      B.fill(wing(0.55,-0.32,0.55,0.36,-0.55,sd),C.text);
      if(o>0.35)B.fill(wing(0.66,-0.4,0.13,0.11,0,sd),C.red);
    }
    const body=[]; for(let k=0;k<18;k++){ const th=k/18*Math.PI*2; body.push(T(Math.cos(th)*0.08,Math.sin(th)*0.48)); }
    B.fill(body,C.blue);
    const lw=Math.max(0.8,s*0.05);
    B.stroke([T(0,-0.42),T(-0.14,-0.72),T(-0.24,-0.86)],C.blue,lw);
    B.stroke([T(0,-0.42),T(0.14,-0.72),T(0.24,-0.86)],C.blue,lw);
  }

  // ---------- poster ----------
  preset(){ return this.PRESETS.find(p=>p.id===this.state.preset)||this.PRESETS[0]; }
  buildPoster(){
    const s=this.state, pr=this.preset(), text=(s.text||'').slice(0,40)||' ';
    this.rand=this.rng(s.seed*7919+1);
    const L=[]; let prev=null, uid=1;
    for(const ch of text){
      if(ch===' '){ const sp={ch:' ',id:9000+uid++,els:[]}; L.push(sp); prev=sp; continue; }
      const same=prev && prev.ch!==' ';
      const l={ch,id:9000+uid++,ws:same?prev.ws:Math.floor(this.rand()*1e9),wi:same?prev.wi+1:0,prev:same?prev:null};
      this.gen(l); L.push(l); prev=l;
    }
    const n=L.length;
    const step=pr.id==='grow'?Math.min(110,3000/n):pr.id==='typed'?Math.min(85,3600/n):0;
    const off=pr.id==='grow'?200:pr.id==='typed'?300:0;
    L.forEach((l,i)=>{ l.b=off+i*step; });
    if(pr.id==='scatter'){ const r=this.rng(s.seed*31+5); L.forEach(l=>{ l.b=150+r()*2400; }); }
    const wd=Math.min(60,900/n);
    L.forEach((l,i)=>{
      l.d=pr.id==='scatter'?4700+i*8:4200+(n-1-i)*wd;
      const nx=L[i+1];
      l.cutRel=null;
      if(pr.id!=='scatter' && l.ch!==' ' && nx && nx.ch===' '){ l.cutRel=Math.max(30,nx.b-l.b); this.genEnd(l,l.cutRel); }
    });
    this.rand=Math.random;
    const res=this.layoutCore(L,1080,1080,false,s.oneLine);
    let S=res.S;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    const addP=(l,x,y,r)=>{ const X=l.tx+x*S, Y=l.ty+y*S, R=(r||0)*S; x0=Math.min(x0,X-R); x1=Math.max(x1,X+R); y0=Math.min(y0,Y-R); y1=Math.max(y1,Y+R); };
    for(const l of L){
      if(l.ch===' ')continue;
      addP(l,-l.tw/S/2,-0.75); addP(l,l.tw/S/2,0.1);
      const all=[...l.els,...(l.endEls||[])];
      for(const e of all){
        if(e.t==='stem')e.pts.forEach(q=>addP(l,q[0],q[1],0.02));
        else if(e.t==='leaf')addP(l,e.x,e.y,e.L);
        else addP(l,e.x,e.y,e.R*1.15);
      }
    }
    let tx0=1e9,tx1=-1e9,ty0=1e9,ty1=-1e9;
    for(const l of L) if(l.ch!==' '){ tx0=Math.min(tx0,l.tx-l.tw/2); tx1=Math.max(tx1,l.tx+l.tw/2); ty0=Math.min(ty0,l.ty-0.72*S); ty1=Math.max(ty1,l.ty); }
    const Z=1080, half=Z*0.44, bcx=(tx0+tx1)/2, bcy=(ty0+ty1)/2;
    let k=Math.min(1.25,half/Math.max(1,bcx-x0,x1-bcx),half/Math.max(1,bcy-y0,y1-bcy));
    if(s.oneLine) k=Math.min(k*1.6, (Z*0.9)/Math.max(1,tx1-tx0));
    k*=(s.size||100)/100;
    L.forEach(l=>{ l.tx=Z/2+(l.tx-bcx)*k; l.ty=Z/2+(l.ty-bcy)*k; l.tw*=k; l.x=l.tx; l.y=l.ty; });
    this.P={letters:L,S:S*k,T:pr.T,preset:pr.id};
    this.pt0=performance.now();
  }
  posterFly(B,tt,P,C){
    const ps=this.perch.slice().sort((a,b)=>a.x-b.x);
    if(!ps.length)return;
    const p1=ps[Math.floor(ps.length*0.25)], p2=ps[Math.min(ps.length-1,Math.floor(ps.length*0.75))];
    const A=[-80,300], s1=[p1.x,p1.y-p1.R*0.55], s2=[p2.x,p2.y-p2.R*0.55], E=[1160,260];
    const sz=Math.max(12,P.S*0.09), t=tt/1000;
    const eo=v=>this.eo(Math.max(0,Math.min(1,v)));
    const leg=(a,b,u,lift)=>{ const e=eo(u); return [a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e-Math.sin(e*Math.PI)*lift]; };
    let p, flying=true, vx=0;
    if(t<1.8){ p=leg(A,s1,t/1.8,160); vx=1; }
    else if(t<3.4){ p=s1; flying=false; }
    else if(t<4.6){ p=leg(s1,s2,(t-3.4)/1.2,140); vx=s2[0]>s1[0]?1:-1; }
    else if(t<5.8){ p=s2; flying=false; }
    else { p=leg(s2,E,(t-5.8)/1.2,60); vx=1; }
    let o, ang;
    if(flying){ o=Math.abs(Math.cos(t*17)); p=[p[0]+Math.sin(t*7)*6,p[1]+Math.sin(t*13)*4]; ang=vx*0.3; }
    else { const burst=(t>2.4 && t<2.8)||(t>5 && t<5.3); o=burst?0.2+0.8*Math.abs(Math.cos(t*9)):0.3+0.1*Math.sin(t*3); ang=0; }
    this.butterfly(B,p[0],p[1],sz,ang,o,C);
  }
  drawBg(g,Z){ g.fillStyle=this.pal().bg; g.fillRect(0,0,Z,Z); }
  bars(B,P,st,spread,hf){
    const S=P.S, byLine={};
    for(const l of P.letters){ if(l.ch===' ')continue; const b=byLine[l.line]||(byLine[l.line]={a:1e9,z:-1e9,y:l.ty}); b.a=Math.min(b.a,l.tx-l.tw/2); b.z=Math.max(b.z,l.tx+l.tw/2); }
    const w=Math.max(2,S*0.035), h=1.0*S*hf;
    for(const k in byLine){ const b=byLine[k], cx=(b.a+b.z)/2, half=(b.z-b.a)/2+0.14*S, cy=b.y-0.33*S; B.rect(cx-half*spread-w/2,cy-h/2,w,h,st.C.text); B.rect(cx+half*spread-w/2,cy-h/2,w,h,st.C.text); }
  }
  posterDraw(g,t){
    const P=this.P; if(!P)return;
    const Z=1080, pc=this.pal();
    g.setTransform(1,0,0,1,0,0);
    this.drawBg(g,Z);
    const tt=((t%P.T)+P.T)%P.T, L=P.letters, B=this.backend(g);
    const st={letters:L,S:P.S,C:pc.C,boil:this.props.boil??true,recoil:this.props.recoil??20,speed:1,wither:600,textAll:true};
    L.forEach(l=>{ l.x=l.tx; l.y=l.ty; l.dead=null; });
    const set=base=>L.forEach(l=>{ l.birth=base+l.b; l.tb=l.birth; l.cut=l.cutRel!=null?l.birth+l.cutRel:null; });
    let bars=null;
    if(P.preset==='breathe'){
      set(-1e5);
      const ph=tt/P.T*Math.PI*2, S=P.S;
      st.warp=(x,y,l)=>{ const h=Math.max(0,(l.y-y)/S); return [x+Math.sin(ph+l.x*0.004+h*1.1)*S*0.03*h, y+Math.cos(ph+x*0.003)*S*0.008*h]; };
      st.rotw=e=>Math.sin(ph+e.id*0.7)*0.12;
    } else if(P.preset==='grow' || P.preset==='scatter'){
      set(0);
      L.forEach(l=>{ if(tt>=l.d)l.dead=l.d; });
    } else if(P.preset==='wind'){
      set(-1e5);
      const S=P.S, u=tt/P.T, front=-0.35+u*1.9;
      st.warp=(x,y,l)=>{
        const hh=Math.max(0,(l.y-y)/S), d=l.x/1080-front;
        const gust=d<0?Math.exp(d*2.2)*Math.cos(-d*9):Math.exp(-d*d*30);
        const idle=Math.sin(tt/1000*1.6+l.x*0.01)*0.012;
        return [x+(gust*0.13+idle)*S*hh*hh*0.6+(gust*0.13+idle)*S*hh*0.4, y+Math.abs(gust)*0.02*S*hh];
      };
      st.rotw=e=>{ const d=e.x/1080-front; return (d<0?Math.exp(d*2.2)*Math.cos(-d*9):Math.exp(-d*d*30))*0.35; };
    } else if(P.preset==='reach'){
      set(-1e5);
      const S=P.S, ph=tt/P.T*Math.PI*2, lx=540+Math.sin(ph)*430, ly=540+Math.sin(ph*2)*260;
      this._light=[lx,ly];
      st.warp=(x,y,l)=>{ const dx=lx-l.x, dy=ly-(l.y-S*0.6), d=Math.hypot(dx,dy)||1, w=Math.max(0,1-d/560), s=w*w*(3-2*w); const hh=Math.min(2.5,Math.max(0,(l.y-y)/S)), f=hh*hh*0.5+hh*0.5; return [x+dx/d*s*S*0.12*f, y+dy/d*s*S*0.06*f]; };
      st.rotw=e=>{ const a=Math.atan2(ly-e.y,lx-e.x); return Math.sin(a)*0.15; };
    } else if(P.preset==='visit'){
      set(-1e5);
      st.perchOn=true; this.perch=[];
      const ph=tt/P.T*Math.PI*2;
      st.warp=(x,y,l)=>{ const hh=Math.max(0,(l.y-y)/P.S); return [x+Math.sin(ph+l.x*0.004+hh)*P.S*0.015*hh, y]; };
    } else {
      if(tt>=4400)return;
      set(0);
      st.letters=L.filter(l=>tt>=l.birth);
      st.textAll=false;
    }
    this.render(B,tt,st);
    if(bars!=null)this.bars(B,P,st,bars,1);
    if(P.preset==='reach'){
      const [lx,ly]=this._light, r=P.S*0.09, pts=[];
      for(let k=0;k<20;k++){ const a=k/20*Math.PI*2; pts.push([lx+Math.cos(a)*r,ly+Math.sin(a)*r]); }
      B.fill(pts,st.C.line);
    }
    if(P.preset==='visit')this.posterFly(B,tt,P,st.C);
    if(P.preset==='typed'){
      const born=st.letters, last=born[born.length-1], S=P.S;
      if(Math.floor(tt/400)%2===0 || (last && tt-last.birth<300)){
        const x=last?last.tx+last.tw/2+0.07*S:540, y=last?last.ty-0.33*S:540, w=Math.max(2,S*0.03), h=0.8*S;
        B.rect(x-w/2,y-h/2,w,h,st.C.text);
      }
    }
  }

  // ---------- export ----------
  dl(blob,name){
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=name;
    a.rel='noopener';
    document.body.appendChild(a);
    try { a.dispatchEvent(new MouseEvent('click')); } catch (e) { a.click(); }
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  dataUrlToBlob(dataUrl){
    const parts = dataUrl.split(',');
    const mime = (parts[0].match(/data:(.*?);/) || [])[1] || 'application/octet-stream';
    const bin = atob(parts[1] || '');
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  savePNG(){
    try {
      this.paint(performance.now(),false);
      this.dl(this.dataUrlToBlob(this.cv.toDataURL('image/png')), 'garden.png');
    } catch (e) {
      this.state.status = 'PNG export failed in this browser.';
      this.updateUI();
    }
  }
  saveSVG(){
    try {
      const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      const parts=[], n=v=>Math.round(v*100)/100;
      const fake=()=>({ d:'', moveTo(x,y){ this.d+=`M${n(x)} ${n(y)}`; }, lineTo(x,y){ this.d+=`L${n(x)} ${n(y)}`; }, quadraticCurveTo(a,b,x,y){ this.d+=`Q${n(a)} ${n(b)} ${n(x)} ${n(y)}`; }, closePath(){ this.d+='Z'; }, getD(){ return this.d; } });
      const B={
        fill:(p,col)=>{ const b=fake(); this.path(b,p,true); parts.push(`<path d="${b.getD()}" fill="${col}"/>`); },
        stroke:(p,col,w)=>{ const b=fake(); this.path(b,p,false); parts.push(`<path d="${b.getD()}" fill="none" stroke="${col}" stroke-width="${n(w)}" stroke-linecap="round" stroke-linejoin="round"/>`); },
        rect:(x,y,w,h,col)=>{ parts.push(`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${col}"/>`); },
        text:(ch,x,y,S,col)=>{ parts.push(`<text x="${n(x)}" y="${n(y)}" text-anchor="middle" dominant-baseline="alphabetic" font-family='${this.F.replace(/"/g,"")}' font-weight="${this.FW}" font-size="${n(S)}" fill="${col}">${esc(ch)}</text>`); }
      };
      this.render(B,performance.now(),this.mainState());
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${n(this.W)}" height="${n(this.H)}" viewBox="0 0 ${n(this.W)} ${n(this.H)}"><rect width="100%" height="100%" fill="${this.pal().bg}"/>${parts.join('')}</svg>`;
      this.dl(new Blob([svg],{type:'image/svg+xml'}),'garden.svg');
    } catch (e) {
      this.state.status = 'SVG export failed in this browser.';
      this.updateUI();
    }
  }
  fname(){ return 'garden-'+(this.state.text||'loop').trim().replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,24)+'-'+this.state.preset; }
  async exportVideo(){
    if(!this.vmime || this.state.busy){ this.state.status='Video export isn’t supported in this browser — use PNG frames.'; this.updateUI(); return; }
    const P=this.P, c=document.createElement('canvas'); c.width=c.height=1080;
    const g=c.getContext('2d'), stream=c.captureStream(0), track=stream.getVideoTracks()[0];
    const rec=new MediaRecorder(stream,{mimeType:this.vmime,videoBitsPerSecond:14e6}), chunks=[];
    rec.ondataavailable=e=>e.data && e.data.size && chunks.push(e.data);
    const done=new Promise(r=>{ rec.onstop=r; });
    this.state.busy=true; this.state.status='Recording…'; this.updateUI();
    this.posterDraw(g,0); rec.start();
    const N=Math.round(P.T/1000*30), wait=ms=>new Promise(r=>setTimeout(r,ms));
    const t0=performance.now();
    for(let i=0;i<N;i++){
      this.posterDraw(g,i*1000/30);
      if(track.requestFrame)track.requestFrame();
      if(i%15===0){ this.state.status=`Recording ${Math.round(i/N*100)}%`; this.updateUI(); }
      const target=t0+(i+1)*1000/30; await wait(Math.max(0,target-performance.now()));
    }
    rec.stop(); await done;
    const ext=this.vmime.includes('mp4')?'mp4':'webm';
    this.dl(new Blob(chunks,{type:this.vmime.split(';')[0]}),`${this.fname()}.${ext}`);
    this.state.busy=false; this.state.status=`Saved ${ext.toUpperCase()} · ${N} frames`; this.updateUI();
  }
  async exportFrames(){
    if(this.state.busy)return;
    const P=this.P, c=document.createElement('canvas'); c.width=c.height=1080;
    const g=c.getContext('2d'), N=Math.round(P.T/1000*30), files=[];
    this.state.busy=true; this.state.status='Rendering frames…'; this.updateUI();
    for(let i=0;i<N;i++){
      this.posterDraw(g,i*1000/30);
      const b=await new Promise(r=>c.toBlob(r,'image/png'));
      files.push({name:`frame_${String(i+1).padStart(4,'0')}.png`,data:new Uint8Array(await b.arrayBuffer())});
      if(i%10===0){ this.state.status=`Rendering ${Math.round(i/N*100)}%`; this.updateUI(); }
    }
    this.dl(this.zip(files),`${this.fname()}-frames.zip`);
    this.state.busy=false; this.state.status=`Saved ${N} PNG frames · 30 fps`; this.updateUI();
  }
  zip(files){
    const crcT=this._crcT || (this._crcT=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })());
    const crc=d=>{ let c=0xFFFFFFFF; for(let i=0;i<d.length;i++)c=crcT[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
    const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
    for(const f of files){
      const nm=enc.encode(f.name), cr=crc(f.data), sz=f.data.length;
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(8,0,true); h.setUint16(12,33,true);
      h.setUint32(14,cr,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true);
      parts.push(h.buffer,nm,f.data);
      const cd=new DataView(new ArrayBuffer(46));
      cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint16(14,33,true);
      cd.setUint32(16,cr,true); cd.setUint32(20,sz,true); cd.setUint32(24,sz,true); cd.setUint16(28,nm.length,true); cd.setUint32(42,off,true);
      cen.push(cd.buffer,nm);
      off+=30+nm.length+sz;
    }
    const cs=cen.reduce((s,b)=>s+(b.byteLength||b.length),0);
    const e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
    return new Blob([...parts,...cen,e.buffer],{type:'application/zip'});
  }
}

window.addEventListener('DOMContentLoaded', () => new TypeGarden());
</script>
